<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 220px; padding: 12px; }
    button { width: 100%; padding: 8px; font-size: 14px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; color: #555; }
    label { display: block; font-size: 13px; margin: 4px 0; }
    #formats { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="formats">
    <label><input type="checkbox" name="fmt" value="md" checked> Markdown (.md)</label>
    <label><input type="checkbox" name="fmt" value="docx"> Word (.docx)</label>
    <label><input type="checkbox" name="fmt" value="pdf"> PDF (.pdf)</label>
  </div>
  <button id="export">Export Thread</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
